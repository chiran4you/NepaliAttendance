<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login • NepaliAttendance</title>
  <style>
    :root{
      --bg:#0b1220;
      --text:#e8eefc;
      --muted:#9fb0d0;
      --border:rgba(255,255,255,.10);
      --brand:#4f46e5;
      --brand2:#6d28d9;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: radial-gradient(1200px 700px at 10% 10%, rgba(109,40,217,.35), transparent 55%),
                  radial-gradient(1200px 700px at 90% 20%, rgba(79,70,229,.35), transparent 55%),
                  linear-gradient(180deg, #070b15 0%, var(--bg) 100%);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card{
      width:min(420px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--border);
      border-radius:20px;
      padding:18px;
      box-shadow: 0 18px 40px rgba(0,0,0,.30);
    }
    .logo{
      width:48px; height:48px; border-radius:16px;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow: 0 14px 30px rgba(79,70,229,.25);
      margin-bottom:12px;
    }
    h1{margin:0; font-size:18px; font-weight:900;}
    p{margin:6px 0 14px; color:var(--muted); font-size:12px; line-height:1.5;}
    label{display:block; font-size:12px; color:var(--muted); font-weight:900; margin:10px 0 6px;}
    input{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid var(--border);
      background: rgba(0,0,0,.18);
      color:var(--text);
      outline:none;
    }
    input:focus{border-color: rgba(79,70,229,.8); box-shadow:0 0 0 3px rgba(79,70,229,.25);}
    button{
      width:100%;
      margin-top:14px;
      padding:12px 12px;
      border:none;
      border-radius:14px;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      color:var(--text);
      font-weight:900;
      cursor:pointer;
      box-shadow: 0 14px 30px rgba(79,70,229,.20);
    }
    button:hover{filter: brightness(1.08);}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <h1>NepaliAttendance Admin</h1>
    <p>Sign in to manage tenant codes and premium licenses.</p>
    <form method="POST" action="/login">
      <label>Password</label>
      <input name="password" type="password" placeholder="Enter admin password" />
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
